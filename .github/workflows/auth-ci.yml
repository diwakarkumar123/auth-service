name: Auth Service CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Debug (IMPORTANT - remove later)
      - name: Check files
        run: ls -la

      # 3️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 4️⃣ Cache dependencies
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci


      # 7️⃣ Build project
      - name: Build project
        run: npm run build

      # 8️⃣ Debug Dockerfile presence
      - name: Check Dockerfile
        run: ls -la

      # 9️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 🔟 Build Docker Image (FIXED SAFE VERSION ✅)
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }} \
            .

      # 1️⃣1️⃣ Push Docker Image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}
